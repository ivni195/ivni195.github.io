<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Out Sale</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0;
            color: #333;
        }
        .lang-selector {
            padding: 5px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
            cursor: pointer;
        }
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .item-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
            position: relative;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .item-card:hover {
            transform: translateY(-5px);
        }
        .item-image {
            width: 100%;
            height: 150px;
            object-fit: cover;
            background-color: #eee;
        }
        .item-info {
            padding: 15px;
        }
        .item-name {
            font-size: 1.2em;
            font-weight: bold;
            margin: 0;
        }
        .item-price {
            color: #e44d26;
            font-weight: bold;
            margin: 5px 0;
        }
        .item-availability {
            font-size: 0.9em;
            color: #666;
            margin: 0;
        }
        .status-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            z-index: 1;
        }
        .sold {
            background-color: #ff4d4d;
            color: white;
        }
        .available {
            background-color: #4caf50;
            color: white;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.9);
            cursor: zoom-out;
        }
        .modal-content {
            margin: auto;
            display: block;
            max-width: 90%;
            max-height: 80%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .close-modal {
            position: absolute;
            top: 20px;
            right: 35px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }
        .close-modal:hover {
            color: #bbb;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1 id="page-title">Move Out Sale</h1>
        <div class="header-actions">
            <button id="contact-btn" class="btn-secondary" onclick="openContactModal()">Show contact info</button>
            <select id="lang-switch" class="lang-selector">
                <option value="en">English</option>
                <option value="jp">日本語</option>
            </select>
        </div>
    </div>

    <!-- Contact Modal -->
    <div id="contact-modal" class="modal" onclick="closeContactModal()">
        <span class="close-modal">&times;</span>
        <div class="contact-modal-content">
            <h2 id="contact-title" style="margin-top: 0;">Contact</h2>
            <div id="contact-images-container" class="contact-images-grid"></div>
        </div>
    </div>

    <style>
        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-secondary {
            padding: 6px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #eee;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-secondary:hover {
            background: #ddd;
        }
        .contact-modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .contact-images-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .contact-qr {
            width: 100%;
            border-radius: 4px;
            border: 1px solid #eee;
        }
    </style>

    <!-- Modal for full image view -->
    <div id="image-modal" class="modal" onclick="closeModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <div id="item-list" class="item-grid">
        <!-- Items will be injected here -->
    </div>

    <script>
        let currentLang = 'en';
        let translations = {};
        let itemsData = [];

        async function init() {
            try {
                const response = await fetch('data.json');
                const data = await response.json();
                translations = data.translations;
                itemsData = data.items;
                renderUI();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function openModal(url) {
            document.getElementById('image-modal').style.display = 'block';
            document.getElementById('modal-img').src = url;
        }

        function closeModal() {
            document.getElementById('image-modal').style.display = 'none';
            document.getElementById('modal-img').src = '';
        }

        function openContactModal() {
            const titleEl = document.getElementById('contact-title');
            if (titleEl) titleEl.textContent = translations[currentLang].contact_title;
            const container = document.getElementById('contact-images-container');
            if (container) {
                container.innerHTML = '';
                const contactImages = ['line.png', 'whatsapp.png'];
                contactImages.forEach(imgName => {
                    const img = document.createElement('img');
                    img.src = `images/contact/${imgName}`;
                    img.className = 'contact-qr';
                    img.alt = imgName;
                    img.onerror = () => img.style.display = 'none';
                    container.appendChild(img);
                });
            }
            document.getElementById('contact-modal').style.display = 'block';
        }

        function closeContactModal() {
            document.getElementById('contact-modal').style.display = 'none';
            const container = document.getElementById('contact-images-container');
            if (container) container.innerHTML = '';
        }


        function renderUI() {
            document.title = translations[currentLang].title;
            document.getElementById('page-title').textContent = translations[currentLang].title;

            const container = document.getElementById('item-list');
            container.innerHTML = '';

            itemsData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                
                const statusClass = item.sold ? 'sold' : 'available';
                const statusText = item.sold ? translations[currentLang].status_sold : translations[currentLang].status_available;
                
                const getName = (val) => typeof val === 'object' ? val[currentLang] : val;
                const getAvail = (val) => typeof val === 'object' ? val[currentLang] : val;
                
                const availText = item.sold ? translations[currentLang].status_sold : getAvail(item.available_from);

                card.innerHTML = `
                    <div class="status-tag ${statusClass}">${statusText}</div>
                    <img src="${item.image}" alt="${getName(item.name)}" class="item-image" onerror="this.src='https://via.placeholder.com/200x150?text=No+Image'">
                    <div class="item-info">
                        <p class="item-name">${getName(item.name)}</p>
                        <p class="item-price">${item.price}￥</p>
                        <p class="item-availability">${translations[currentLang].label_available} ${availText}</p>
                    </div>
                `;

                card.addEventListener('click', () => openModal(item.image));
                container.appendChild(card);
            });
        }

        document.getElementById('lang-switch').addEventListener('change', (e) => {
            currentLang = e.target.value;
            renderUI();
        });

        init();
    </script>
</body>
</html>
